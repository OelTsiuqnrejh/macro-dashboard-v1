name: Daily Macro Update

# KÖR VARJE NATT KL 23:00 UTC (00:00/01:00 Svensk tid) ELLER MANUELLT
on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

# DETTA LÖSER EXIT CODE 128 (Ger roboten rätt att spara filen)
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # Uppdaterad till v4

    - name: Set up Python
      uses: actions/setup-python@v5 # Uppdaterad till v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance fredapi

    - name: Run Update Script
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: |
        python update_data.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add macro_scored_data.csv
        
        # Kollar om filen faktiskt har ändrats innan den försöker spara
        if git diff-index --quiet HEAD; then
          echo "Ingen ny data att spara. Allt är redan uppdaterat!"
        else
          git commit -m "Automated macro data update"
          git push
        fi
